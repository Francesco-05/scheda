name: Notifiche

# Orari in UTC: per ogni promemoria c'è una riga per l'ora legale e una per l'ora solare.
# Lo script invia solo quella che corrisponde all'orario italiano (10:30, 18:00, 21:00).
on:
  schedule:
    - cron: "30 8 * * *"   # 10:30 ora legale
    - cron: "30 9 * * *"   # 10:30 ora solare
    - cron: "0 16 * * *"   # 18:00 ora legale
    - cron: "0 17 * * *"   # 18:00 ora solare
    - cron: "0 19 * * *"   # 21:00 ora legale
    - cron: "0 20 * * *"   # 21:00 ora solare
  workflow_dispatch:
    inputs:
      slot:
        description: "Quale notifica (test, acqua, passi, sera)"
        default: "test"

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/send.mjs
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          SLOT: ${{ github.event.inputs.slot }}
